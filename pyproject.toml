# Vision stacks packaged as extras to support Windows Python 3.13
vision = [
  "torch==2.9.1; python_version < '3.13'",
  "torchvision==0.24.1; python_version < '3.13'",
  "sentence-transformers==5.1.2; python_version < '3.13'",
  "ultralytics==8.3.234; python_version < '3.13'",
]
vision313_win = [
  "torch; python_version >= '3.13' and platform_system == 'Windows'",
  "torchvision; python_version >= '3.13' and platform_system == 'Windows'",
]

[tool.setuptools.packages.find]
include = ["LoOper*", "OverWatch*"]

